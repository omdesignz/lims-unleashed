<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="910" height="385" viewBox="55 55 910 385" role="img" aria-labelledby="title desc">
<title id="title">VAP Sistemas — VAP_Animated.svg</title>
<desc id="desc">Optically refined V/A structure, flowing ribbon and P. Negative space is transparent. Production master geometry.</desc>
<metadata>VAP optical refinement, 2026-09-29. Navy #061F46; blue #087CF0. No raster content. Negative-space guide is non-rendering; separation is built into the contours.</metadata>
<defs><clipPath id="ribbon-outline" clipPathUnits="userSpaceOnUse"><path d="M 256 375 L 343 257 C 365.119 227 395 212 425 212 C 459 212 484.503 225.62 501 254 L 594 414 C 580 410 568.842 399 559 382 L 493 268 C 484.895 254 479 246 470 246 C 458 246 450.171 254 440 268 L 355 385 C 336.838 410 312 422 280 416 C 253.333 411 244.203 391 256 375 Z"/></clipPath></defs><style>
#structure {animation:structure-in .24s cubic-bezier(.22,1,.36,1) backwards}
#flow-reveal {animation:travel .52s .18s cubic-bezier(.4,0,.2,1) both}
#p {animation:p-in .22s .65s cubic-bezier(.22,1,.36,1) backwards}
#ribbon {animation:ribbon-settle .70s step-end backwards}
#flow-travel {animation:travel-hide .001s .70s step-end forwards}
@keyframes ribbon-settle {from{visibility:hidden}to{visibility:visible}}
@keyframes travel-hide {to{display:none}}
@keyframes structure-in {from{opacity:0}to{opacity:1}}
@keyframes flow-in {from{opacity:0}to{opacity:1}}
@keyframes travel {from{stroke-dashoffset:1000}to{stroke-dashoffset:0}}
@keyframes p-in {from{opacity:0;transform:translateX(3px)}to{opacity:1;transform:translateX(0)}}
@media (prefers-reduced-motion:reduce) {#structure,#flow,#p,#flow-reveal,#ribbon,#flow-travel {animation:none} #flow-travel {display:none}}
</style>
